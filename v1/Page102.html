			<h1>Tekbiri dhe tesbihu gjatë udhëtimit</h1>
		</div><!-- /header -->

		<div data-role="content">	
		<p><strong>Transmetohet nga Xhabiri radijAll-llahu an-hu, i cili ka thënë: “Kur hipnim (në mjetin e udhëtimit), merrnim tekbir, ndërsa kur zbris-nim e madhëronim All-llahun (d.m.th. e bënim tesbih)”.</strong></p>
		<p><small>Buhariu “Fet-hul-Bari” 6/135.</small></p>
