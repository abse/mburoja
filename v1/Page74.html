	<div data-role="header" data-position="fixed" data-theme="e">
			<h1>Duaja e agjëruesit kur i ofrohet ushqimi dhe nuk ha</h1>
		</div><!-- /header -->

		<div data-role="content">	
		<p><strong>Transmetohet se Pejgamberi s.a.v.s. ka thënë: “Kur të ftohet ndokush prej jush le t`i përgjigjet ftesës. Nëse është agjërues, le të bëjë dua (le të lutet për atë person), e nëse s`është agjërues, le të hajë”.</strong></p>
		<p><small>Muslimi 2/1054.</small></p>

		</div><!-- /content -->
