			<h1>Si bënte tesbih Pejgamberi s.a.v.s.</h1>
		</div><!-- /header -->

		<div data-role="content">	
		<p>Abdullah ibën Omeri radiAll-llahu anhu ka thënë: E kam parë Pejgamberin salAll-llahu alejhi ve selem duke bërë tesbih me dorën e djathtë.<p>
		<p><small>Ebu Davudi me tekstin e tij 2/81, Tirmidhiu 5/521. Shih "Sahih El Xhamië" 4/271 nr. 4865.</small></p>
