			<h1>Si e lavdëron muslimani muslimanin</h1>
		</div><!-- /header -->

		<div data-role="content">	
		<p><strong>Pejgamberi s.a.v.s. ka thënë: “Nëse ndonjëri prej jush e lavdëron shokun e tij, le të thotë: “E konsideroj filanin, All-llahu e di më së miri për të dhe nuk e lavdëroj askënd para All-lla-hut, e konsideroj (nëse di për atë) kështu, kështu”.</strong></p>
		<p><small>Muslimi 4/2296.</small></p>
		</div><!-- /content -->
